name: Extract Server Zip
on:
  workflow_dispatch:
  push:
    paths:
      - 'NetworkEncyclopedia_Server_Complete.zip'
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip into place
        run: |
          if [ -f NetworkEncyclopedia_Server_Complete.zip ]; then
            unzip -o NetworkEncyclopedia_Server_Complete.zip
            rm -f NetworkEncyclopedia_Server_Complete.zip
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git status
            git commit -m "ci: extract Server_Complete.zip into server/ and windows/" || echo "nothing to commit"
            git push
          else
            echo "Zip not found"
            exit 1
          fi
