name: Build APK v1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f51874764545162ea396f5d536e251650e41b" > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null 2>&1 || true

      - name: Icons + curriculum
        run: |
          python3 scripts/install_android_icon.py
          python3 scripts/export_android_index.py
          python3 scripts/merge_content_packs_into_android.py || true

      - name: Gradle build
        working-directory: android
        run: |
          set -e
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          sudo unzip -qo /tmp/gradle.zip -d /opt
          /opt/gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          set -e
          mkdir -p dist
          echo "=== all apk files ==="
          find android -name "*.apk" -print || true
          echo "=== outputs tree ==="
          find android/app/build/outputs -type f 2>/dev/null | head -40 || true
          # copy every apk to dist/
          found=0
          while IFS= read -r f; do
            cp -v "$f" "dist/$(basename "$f")"
            found=1
          done < <(find android -name "*.apk" 2>/dev/null)
          if [ "$found" != "1" ]; then
            echo "No APK produced"
            exit 1
          fi
          ls -lah dist/

      - uses: actions/upload-artifact@v4
        with:
          name: EngineerJokar-APK-v1
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
