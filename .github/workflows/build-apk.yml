name: Build APK v1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bootstrap Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          unzip -qo /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          mkdir -p "$SDK_ROOT/licenses"
          printf '%s\n' "24333f8a63b6825ea9c5514f83c2829b004d1fee" "d56f51874764545162ea396f5d536e251650e41b" > "$SDK_ROOT/licenses/android-sdk-license"
          yes | sdkmanager --licenses >/tmp/lic.txt 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          test -d "$SDK_ROOT/platforms/android-34"
          test -d "$SDK_ROOT/build-tools/34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk ok at $SDK_ROOT"

      - name: Icons + curriculum
        run: |
          set -e
          python3 scripts/install_android_icon.py
          python3 scripts/export_android_index.py
          python3 scripts/merge_content_packs_into_android.py || true

      - name: Gradle assembleDebug
        id: gradle
        working-directory: android
        continue-on-error: true
        run: |
          set -e
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          # Use Gradle Wrapper generator more robustly
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          sudo unzip -qo /tmp/gradle.zip -d /opt
          /opt/gradle-8.2/bin/gradle wrapper --gradle-version 8.2 --stacktrace
          chmod +x gradlew
          # Capture full log
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee ../gradle-build.log
          # Force exit code from gradle
          exit ${PIPESTATUS[0]}

      - name: Upload Gradle log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if Gradle failed
        if: steps.gradle.outcome == 'failure'
        run: |
          echo "Gradle assembleDebug failed. See gradle-build-log artifact for details."
          exit 1

      - name: Collect APK
        run: |
          set -e
          mkdir -p dist
          find android -name "*.apk" -print
          find android -name "*.apk" -exec cp -v {} dist/ \;
          ls -lah dist/
          test "$(ls -A dist/*.apk 2>/dev/null)"

      - uses: actions/upload-artifact@v4
        with:
          name: EngineerJokar-APK-v1
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
