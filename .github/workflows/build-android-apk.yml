# ساخت APK فقط با Run workflow دستی — محتوا تا همان commit
name: Build Android APK (دستی)

on:
  workflow_dispatch:
    inputs:
      note:
        description: "یادداشت اختیاری (مثلاً تا فصل ۱۵)"
        required: false
        default: "manual"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android licenses & install platform
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -20

      - name: Content note
        run: |
          echo "Build note: ${{ github.event.inputs.note }}"
          echo "Commit: ${{ github.sha }}"
          ls server/core/chapter*.py 2>/dev/null || true

      - name: Ensure Gradle Wrapper
        working-directory: android
        run: |
          set -e
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            printf '%s\n' \
              'distributionBase=GRADLE_USER_HOME' \
              'distributionPath=wrapper/dists' \
              'distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip' \
              'networkTimeout=10000' \
              'validateDistributionUrl=true' \
              'zipStoreBase=GRADLE_USER_HOME' \
              'zipStorePath=wrapper/dists' \
              > gradle/wrapper/gradle-wrapper.properties
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          if [ ! -f gradlew ]; then
            curl -fsSL -o gradlew "https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew"
          fi
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android -name "*.apk" -path "*/outputs/*" | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkEncyclopedia-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
