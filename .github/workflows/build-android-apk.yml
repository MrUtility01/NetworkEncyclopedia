name: Build Android APK (دستی)

on:
  workflow_dispatch:
    inputs:
      note:
        description: "یادداشت"
        required: false
        default: "manual"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -5 || true

      - name: Export curriculum + merge packs
        run: |
          set -e
          python3 scripts/export_android_index.py
          python3 scripts/merge_content_packs_into_android.py || echo "WARN merge"
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path
          p = Path("android/app/src/main/assets/curriculum_index.json.gz")
          d = json.loads(gzip.open(p, "rt", encoding="utf-8").read())
          print("chapters", len(d["chapters"]), "lessons", d["lesson_count"])
          orders = [c["order"] for c in d["chapters"]]
          print("orders tail", orders[-5:])
          assert len(d["chapters"]) >= 64, "need >=64 chapters"
          assert d["lesson_count"] >= 5400, "need >=5400 lessons"
          assert 64 in orders, "chapter 64 Git missing"
          PY

      - name: Ensure Gradle Wrapper
        working-directory: android
        run: |
          set -e
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            printf '%s\n' 'distributionBase=GRADLE_USER_HOME' 'distributionPath=wrapper/dists' 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip' 'networkTimeout=10000' 'validateDistributionUrl=true' 'zipStoreBase=GRADLE_USER_HOME' 'zipStorePath=wrapper/dists' > gradle/wrapper/gradle-wrapper.properties
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar "https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          if [ ! -f gradlew ]; then
            curl -fsSL -o gradlew "https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew"
          fi
          chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android -name "*.apk" -path "*/outputs/*" | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: NetworkEncyclopedia-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
