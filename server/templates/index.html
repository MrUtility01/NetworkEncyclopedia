<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Engineer Jokar — دایرةالمعارف شبکه</title>
  <link rel="stylesheet" href="/static/app.css" />
  <link rel="stylesheet" href="/static/sync_ui.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <strong>Engineer Jokar</strong>
        <span id="stats" class="muted">در حال آماده‌سازی…</span>
      </div>
      <div class="search-box">
        <input id="q" type="search" placeholder="جستجو در عناوین و محتوا…" autocomplete="off" />
        <button id="btnSearch" type="button">جستجو</button>
      </div>
      <div class="top-actions">
        <button id="btnHome" type="button" class="ghost active">خانه</button>
        <button id="btnInfo" type="button" class="ghost">اینفوگرافیک</button>
        <button id="btnTasks" type="button" class="ghost">کارهای روزانه</button>
        <button id="btnNotes" type="button" class="ghost">نکته‌ها</button>
        <button id="btnScenarios" type="button" class="ghost">سناریوها</button>
        <button id="btnQuiz" type="button" class="ghost">سوالات</button>
        <a href="/workspace" class="ghost" style="display:inline-flex;align-items:center;padding:8px 12px;text-decoration:none;border:1px solid var(--border);border-radius:10px;color:inherit;font-size:13px">فضای کاری+</a>
        <button id="btnReseed" type="button" class="ghost danger">بازسازی</button>
      </div>
    </header>

    <div id="syncBar" class="sync-bar">
      <div class="sync-item">
        <span class="sync-label">LAN IP</span>
        <code id="lanIp">—</code>
        <button type="button" id="btnCopyIp" class="ghost tiny">کپی</button>
      </div>
      <div class="sync-item">
        <span class="sync-label">اندروید</span>
        <code id="androidHint">http://IP:5050</code>
      </div>
      <div class="sync-item">
        <button type="button" id="btnSyncStatus" class="ghost tiny">وضعیت Sync</button>
        <span id="syncStatus" class="muted">—</span>
      </div>
    </div>

    <div class="main">
      <aside class="sidebar">
        <div class="side-head">فهرست فصل‌ها</div>
        <div id="chapters" class="tree"></div>
      </aside>
      <section class="content">
        <div id="breadcrumb" class="breadcrumb">خانه</div>
        <div id="viewer" class="viewer"></div>
      </section>
    </div>
  </div>
  <script src="/static/app.js"></script>
  <script src="/static/sync_ui.js"></script>
</body>
</html>
